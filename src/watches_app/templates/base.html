<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}My Watches{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1><a href="{{ url_for('watches.index') }}">My Watches</a></h1>
    <nav>
      <a href="{{ url_for('watches.new_watch') }}">Add a watch</a>
      <a href="{{ url_for('watches.history') }}">History</a>
    </nav>
  </header>

  {% with messages = get_flashed_messages() %}
    {% for message in messages %}
      <div class="flash">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</body>
</html>
